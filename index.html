<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Personal digital portfolio of an Information Technology student specializing in Network and Security.">
<title>Digital Portfolio – IT (Network and Security)</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050b1a;--surface:#0b1630;--surface2:#101f42;--line:#1c2d5a;--text:#e8eeff;--muted:#93a4cc;--blue:#2d8cff;--cyan:#27d3ff;--glow:0 0 24px rgba(45,140,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.65 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;background-image:linear-gradient(rgba(45,140,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(45,140,255,.05) 1px,transparent 1px);background-size:44px 44px}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;line-height:1.15;margin:0 0 .6em}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{width:min(1120px,92%);margin:0 auto}
/* nav */
header{position:sticky;top:0;z-index:20;background:rgba(5,11,26,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font:800 1.15rem Sora,sans-serif;color:var(--text);text-decoration:none;display:flex;gap:.5rem;align-items:center}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
nav ul{display:flex;gap:.3rem;list-style:none;margin:0;padding:0}
nav a{color:var(--muted);text-decoration:none;padding:.5rem .9rem;border-radius:8px;transition:.2s}
nav a:hover,nav a.on{color:#fff;background:var(--surface2)}
nav a.on{box-shadow:inset 0 -2px var(--blue)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;width:44px;height:40px;font-size:1.2rem;cursor:pointer}
@media(max-width:760px){.burger{display:block}nav{position:absolute;left:0;right:0;top:66px;background:var(--bg);border-bottom:1px solid var(--line);display:none}nav.open{display:block}nav ul{flex-direction:column;padding:.6rem 4%}}
/* pages */
main{flex:1}
.page{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
section{padding:3.5rem 0}
h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}
.lead{color:var(--muted);max-width:62ch}
.btn{display:inline-block;font:600 .95rem Sora,sans-serif;padding:.85rem 1.4rem;border-radius:10px;border:1px solid var(--blue);color:#fff;background:linear-gradient(135deg,var(--blue),#1450c8);text-decoration:none;cursor:pointer;transition:.25s;box-shadow:var(--glow)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(39,211,255,.5)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--cyan);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--cyan)}
/* hero */
.hero{position:relative;overflow:hidden;padding:4.5rem 0 5rem}
#net{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:3rem;align-items:center}
.hero h1{font-size:clamp(2.2rem,5.4vw,4rem);font-weight:800;letter-spacing:-.02em}
.hero h1 span{display:block;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .hi{color:var(--cyan);font-weight:500;margin-bottom:1rem}
.cta{display:flex;gap:.8rem;flex-wrap:wrap;margin:1.6rem 0}
.pfp{position:relative;width:min(380px,80%);aspect-ratio:1;margin:auto}
.pfp::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed var(--blue);animation:spin 40s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.pfp .ph{width:100%;height:100%;border-radius:50%;box-shadow:var(--glow)}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.pfp{order:-1;width:min(260px,70%)}}
/* shared blocks */
.grid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:linear-gradient(160deg,var(--surface),var(--bg));border:1px solid var(--line);border-radius:14px;padding:1.3rem;transition:.25s}
.card:hover{border-color:var(--blue);box-shadow:var(--glow)}
.card h3{font-size:1.05rem;margin-bottom:.3em}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.ico{font-size:1.6rem;display:block;margin-bottom:.6rem}
.ph{display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,var(--surface2),var(--surface)) center/cover no-repeat;border:1px dashed var(--blue);border-radius:12px;color:var(--muted);cursor:pointer;min-height:120px;padding:.8rem;transition:.2s}
.ph:hover{border-color:var(--cyan);color:#fff}
.ph small{display:block;font-size:.75rem;opacity:.75}
.ph.has{border-style:solid}.ph.has span{display:none}
.tag{display:inline-block;font-size:.75rem;color:#ffd479;border:1px solid #6b5420;border-radius:99px;padding:.1rem .6rem;margin-bottom:1rem}
.note{background:var(--surface);border-left:3px solid var(--cyan);padding:.8rem 1rem;border-radius:6px;color:var(--muted);font-size:.9rem;margin-bottom:2rem}
.pagehead{padding:3rem 0 0}
/* personal */
.cols{display:grid;grid-template-columns:300px 1fr;gap:2rem;align-items:start}
.facts{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.fact b{display:block;color:var(--muted);font-weight:500;font-size:.85rem}
.fact span{font-weight:500}
.motto{font:600 1.3rem/1.4 Sora,sans-serif;border-left:3px solid var(--blue);padding-left:1rem;margin:1.5rem 0}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
/* achievements */
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0 2rem}
.chip{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:.4rem 1rem;cursor:pointer;font:inherit}
.chip.on,.chip:hover{color:#fff;border-color:var(--cyan);background:var(--surface2)}
.tl{position:relative;padding-left:2rem;border-left:2px solid var(--line);display:grid;gap:1.2rem}
.item{position:relative;display:grid;grid-template-columns:150px 1fr;gap:1.1rem}
.item::before{content:"";position:absolute;left:calc(-2rem - 7px);top:1.4rem;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan)}
.item .ph{min-height:100px}
.meta{color:var(--cyan);font-size:.85rem}
.item[hidden]{display:none}
@media(max-width:560px){.item{grid-template-columns:1fr}}
.gal{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.gal .ph{aspect-ratio:4/3}
/* family */
.members .card{text-align:center}
.members .ph{width:110px;height:110px;border-radius:50%;margin:0 auto 1rem;min-height:0}
.rel{color:var(--cyan);font-size:.9rem;margin-bottom:.5rem!important}
blockquote{margin:0 0 2rem;font:600 clamp(1.1rem,2.4vw,1.5rem)/1.5 Sora,sans-serif;max-width:48ch}
.group .ph{aspect-ratio:21/9;width:100%}
/* footer */
footer{border-top:1px solid var(--line);background:rgba(5,11,26,.9);padding:2rem 0;margin-top:2rem}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.soc{display:flex;gap:.6rem}.soc a{border:1px solid var(--line);border-radius:8px;padding:.35rem .8rem;color:var(--text);text-decoration:none}.soc a:hover{border-color:var(--cyan)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ===== NO-SCROLL LAYOUT: every screen fits the window ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh}
.bar{height:56px}
nav{--navh:56px}
@media(max-width:760px){nav{top:56px}}
main{flex:1;min-height:0;overflow:hidden}
.panel{height:100%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.body{padding:.5rem 0}
.ph1{font-size:clamp(1.3rem,3.6vw,2.1rem);margin:0 0 .5rem}
h2{font-size:clamp(1.1rem,2.6vw,1.6rem);margin-bottom:.4rem}
.lead{margin:0 0 .6rem;font-size:clamp(.85rem,1.6vw,1rem)}
.hero{height:100%;padding:.8rem 0;display:flex;align-items:center}
.hero h1{font-size:clamp(1.5rem,4.6vw,3.4rem);margin-bottom:.6rem}
.cta{margin:1rem 0}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pills span{font-size:.78rem;border:1px solid var(--line);background:rgba(11,22,48,.7);border-radius:99px;padding:.25rem .7rem;color:var(--muted)}
.pfp{width:min(340px,42vh,80%)}
@media(max-width:820px){.pfp{width:min(150px,22vh);order:-1}.hero .wrap{gap:.8rem}.hero .hi{margin-bottom:.4rem}.btn{padding:.65rem 1rem}}
@media(max-height:720px){.hide-s{display:none}}
.card{padding:.8rem}
.ico{font-size:1.25rem;margin-bottom:.3rem}
.grid{gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.sm{margin-bottom:.8rem}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card p{font-size:.88rem}
.cols{grid-template-columns:min(260px,30vh) 1fr;gap:1.2rem;align-items:center}
.avatar .ph{aspect-ratio:1;width:100%}
.motto{font-size:1.05rem;margin:.6rem 0 0}
@media(max-width:620px){.cols{grid-template-columns:1fr}.avatar{width:min(150px,22vh);margin:auto}}
.facts{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.fact{padding:.6rem .8rem}.fact span{font-size:.88rem}
.chips{margin:.4rem 0 .8rem;gap:.4rem}.chip{padding:.25rem .8rem;font-size:.85rem}
.tl{gap:.6rem;padding-left:1.4rem}
.item{grid-template-columns:110px 1fr;gap:.8rem;padding:.6rem}
.item::before{left:calc(-1.4rem - 7px);top:1rem}
.item .ph{min-height:56px;height:100%}
.item h3{margin:0}.item p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.item{grid-template-columns:1fr}.item .ph{display:none}}
.gal{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.gal .ph{aspect-ratio:4/3;min-height:0;max-height:26vh}
blockquote{font-size:clamp(.95rem,2vw,1.3rem);margin:0 0 .8rem}
.group .ph{aspect-ratio:auto;height:min(38vh,320px);width:100%}
.members .ph{width:min(90px,12vh);height:min(90px,12vh);margin:0 auto .5rem}
/* bottom controls and slim footer */
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem 0}
.ctrl .btn{padding:.55rem 1rem;font-size:.85rem}
.ctrl .btn:disabled{opacity:.4}
.dots{display:flex;gap:.4rem}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
footer{padding:.4rem 0;margin:0}
footer .wrap{font-size:.75rem;gap:.5rem}
.soc a{padding:.15rem .6rem}

/* ===== NEW ACHIEVEMENTS DESIGN: photo cards, 3 per screen ===== */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;align-items:stretch}
@media(max-width:699px){.ach{grid-template-columns:1fr}}
.ach-card{display:flex;flex-direction:column;gap:.6rem;padding:.6rem;overflow:hidden}
.ach-card .ph{width:100%;aspect-ratio:16/10;max-height:30vh;min-height:0;padding:.4rem}
@media(max-width:699px){.ach-card .ph{aspect-ratio:16/8;max-height:24vh}}
.ach-b{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.ach-b h3{font-size:1rem;margin:0}
.ach-b .meta{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.ach-b p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ach-card .by{color:var(--text);font-size:.82rem;font-weight:500}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#home"><i></i><span id="brand"></span></a>
  <button class="burger" aria-label="Open menu" aria-expanded="false">☰</button>
  <nav id="nav"><ul>
    <li><a href="#home" data-p="home">Home</a></li>
    <li><a href="#personal" data-p="personal">Personal Information</a></li>
    <li><a href="#achievements" data-p="achievements">Achievements</a></li>
    <li><a href="#family" data-p="family">My Family</a></li>
  </ul></nav>
</div></header>
<main id="app"></main>
<div class="wrap ctrl"><button class="btn ghost" id="prev">← Back</button><div class="dots" id="dots" aria-hidden="true"></div><button class="btn" id="next">Next →</button></div>
<footer><div class="wrap">
  <span id="copy"></span>
  <div class="soc" id="soc"></div>
</div></footer>

<script>
/* ============================================================
   EDIT HERE: everything on the site comes from this CONFIG.
   Photos: put them next to index.html (or in assets/images/)
   and write the path, e.g. "img": "assets/images/me.jpg"
   ============================================================ */
const CONFIG = {
  name: "Zadery Jay Joseph Dangayo",
  nickname: "Zjay",
  tagline: "Exploring Technology. Connecting Networks. Securing the Digital World.",
  socials: [["GitHub","https://github.com/"],["LinkedIn","https://www.linkedin.com/"],["Facebook","https://www.facebook.com/"]],
  profileImg: "aaaaaaas.jpg",
  interests: [
    ["🌐","Network Administration","Configuring, monitoring and maintaining reliable networks."],
    ["🛡️","Cybersecurity","Protecting systems and data from threats."],
    ["🔌","Computer Networking","How devices talk to each other, from cables to protocols."],
    ["💻","Information Technology","Solving real problems with the right tools."],
    ["💡","Technology Innovation","Trying new ideas and learning what comes next."]
  ],
  info: [
    ["Full Name","Zadery Jay Joseph G. Dangayo"],["Nickname","Zjay"],["Age","19"],["Height","5'7"]
    ["Birthday","August 29, 2007"],["Address","Lower Polacion, Sablan, Benguet"],["Gender","Male"],
    ["Nationality","Filipino"],["Course","Bachelor of Science in Information Technology"],
    ["Specialization","Network and Security"],["School","University of the Cordilleras"],
    ["Hobbies and Interests","Network Configuration and Troubleshooting"]
  ],
  motto: "Life shrinks or expands in proportion to one's courage",
  bio: "I'm an Information Technology student who enjoys figuring out how networks work and how to keep them safe. I like building small labs at home, breaking them on purpose, and learning how to fix them.",
  goals: "Finish my degree with strong grades, earn entry-level networking and security certifications, and build a home lab to practice what I learn.",
  career: "Start as a network or systems administrator, grow into a security analyst role, and eventually work toward network security engineering.",

  /* ---------- ACHIEVEMENTS: write yours here ----------
     Copy one line {...} to add more. Each one becomes a card.
       cat   = category (becomes a filter button). Use any name:
               Academic, Certificates, Activities, Awards, Skills ...
       title = name of the achievement
       year  = year or date, e.g. "2026" or "March 2026"
       by    = (optional) who gave it / where, e.g. "University of the Cordilleras"
       desc  = 1 to 2 sentences about it (long text is cut after 3 lines)
       img   = photo path, e.g. "assets/images/dean-lister.jpg"
               Leave "" to show a box you can click to add a photo.
  */
  achievements: [
    {cat:"Awards",       title:"Best Midfielder (Under 15)", year:"2023", by:"Lamut United Football Club", desc:"Certificate of Recognition for exemplary performance in the 1st LUFC 7-aside Football Tournament, given June 11, 2023 at Lamut Central School, Ifugao.", img:"IMG_20230706_210931_723.jpg"},
    {cat:"Academic",     title:"Write your achievement title here", year:"2026", by:"Where or who gave it", desc:"Write a short description of what you achieved.", img:""},
    {cat:"Certificates", title:"Write your achievement title here", year:"2025", by:"Where or who gave it", desc:"Write a short description of what you achieved.", img:""},
    {cat:"Activities",   title:"Write your achievement title here", year:"2024", by:"Where or who gave it", desc:"Write a short description of what you achieved.", img:""},
    {cat:"Skills",       title:"Write your achievement title here", year:"2026", by:"Where or who gave it", desc:"Write a short description of what you achieved.", img:""}
  ],
  /* Gallery: label = caption, img = photo path ("" to add by clicking) */
  gallery: [
    {label:"Certificate 1", img:""},
    {label:"Certificate 2", img:""},
    {label:"Award photo", img:"IMG_20230706_210931_723.jpg"},
    {label:"Activity photo", img:""},
    {label:"Milestone photo", img:""}
  ],

  familyIntro: "My family is one of the most important parts of my life. They are my source of inspiration, strength, motivation, and support as I continue pursuing my dreams and goals.",
  members: [
    {name:"Jessica G. Dangayo",rel:"Mother",msg:"Short message.",img:""},
    {name:"Zadery D. Dangayo",rel:"Father",msg:"Short message.",img:""},
    {name:"Zadeya Joy G. Dangayo",rel:"Sibling",msg:"Short message.",img:""}
  ],
  memories: ["Family trip","Birthday celebration","Holiday dinner","Graduation day","Weekend together","Favorite memory"]
};

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const ph = (label,cls="",img="") => `<div class="ph ${cls} ${img?"has":""}" tabindex="0" role="button" aria-label="Add photo: ${label}" ${img?`style="background-image:url('${img}')"`:""}><span>${label}<small>Click to add your photo</small></span></div>`;
const wrap = (h) => `<div class="wrap body">${h}</div>`;
const head = (t,sub="") => `<h1 class="ph1">${t}</h1>${sub?`<p class="lead">${sub}</p>`:""}`;
const cards = (a) => a.map(i=>`<div class="card"><span class="ico">${i[0]}</span><h3>${i[1]}</h3>${i[2]?`<p>${i[2]}</p>`:""}</div>`).join("");

/* ---------- pages: each page is a list of screens (no scrolling) ---------- */
const order = ["home","personal","achievements","family"];
const names = {home:"Home",personal:"Personal Information",achievements:"Achievements",family:"My Family"};
let achFilter = "All", lastPer = 3;
const pages = {
home: () => [`
<div class="hero"><canvas id="net" aria-hidden="true"></canvas>
  <div class="wrap">
    <div>
      <p class="hi">Hello, Welcome to My Digital Portfolio!</p>
      <h1>Exploring Technology.<span>Connecting Networks.</span><span>Securing the Digital World.</span></h1>
      <p class="lead hide-s">I’m ${CONFIG.name}, an Information Technology student specializing in Network and Security. I am passionate about technology, networking, cybersecurity, and continuously developing my skills in the digital world.</p>
      <div class="cta"><a class="btn" href="#achievements">Explore My Portfolio</a><a class="btn ghost" href="#personal">Get to Know Me</a></div>
      <div class="pills">${CONFIG.interests.map(i=>`<span>${i[0]} ${i[1]}</span>`).join("")}</div>
    </div>
    <div class="pfp">${ph("Profile picture","",CONFIG.profileImg)}</div>
  </div>
</div>`],

personal: () => [
  wrap(`${head("Personal Information")}
    <div class="cols"><div class="avatar">${ph("Profile picture","",CONFIG.profileImg)}</div>
    <div><h2>About me</h2><p class="lead">${CONFIG.bio}</p><p class="motto">“${CONFIG.motto}”</p></div></div>`),
  wrap(`${head("My details")}<div class="facts">${CONFIG.info.map(f=>`<div class="card fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}</div>`),
  wrap(`${head("Interests, goals and career")}
    <div class="grid sm">${cards(CONFIG.interests.map(i=>[i[0],i[1],""]))}</div>
    <div class="grid two"><div class="card"><span class="ico">🎯</span><h3>My goals as an IT student</h3><p>${CONFIG.goals}</p></div>
    <div class="card"><span class="ico">🚀</span><h3>My future career</h3><p>${CONFIG.career}</p></div></div>`)
],

achievements: () => {
  const cats = ["All",...new Set(CONFIG.achievements.map(a=>a.cat))];
  if(!cats.includes(achFilter)) achFilter = "All";
  const list = achFilter==="All" ? CONFIG.achievements : CONFIG.achievements.filter(a=>a.cat===achFilter);
  const per = innerWidth < 700 ? 1 : 3; lastPer = per;
  const chunks = [];
  for(let i=0;i<list.length;i+=per) chunks.push(list.slice(i,i+per));
  if(!chunks.length) chunks.push([]);
  const chips = `<div class="chips" role="group" aria-label="Filter achievements">${cats.map(c=>`<button class="chip ${c===achFilter?"on":""}" data-cat="${c}">${c}</button>`).join("")}</div>`;
  const card = a => `<article class="card ach-card">${ph("Photo: "+a.title,"",a.img)}<div class="ach-b"><span class="meta">${a.cat} · ${a.year}</span><h3>${a.title}</h3>${a.by?`<span class="by">${a.by}</span>`:""}<p>${a.desc}</p></div></article>`;
  const gal = x => typeof x === "string" ? ph(x) : ph(x.label,"",x.img);
  return [
    ...chunks.map(ch => wrap(`${head("Achievements")}${chips}<div class="ach">${ch.length?ch.map(card).join(""):'<p class="lead">Nothing in this category yet.</p>'}</div>`)),
    wrap(`${head("Gallery","Click any box to add a picture of a certificate, award or memorable moment.")}<div class="gal">${CONFIG.gallery.map(gal).join("")}</div>`)
  ];
},

family: () => [
  wrap(`${head("My Family")}<blockquote>${CONFIG.familyIntro}</blockquote><div class="group">${ph("Family group photo")}</div>`),
  wrap(`${head("The people behind me")}<div class="grid members">${CONFIG.members.map(m=>`<div class="card">${ph("Photo","",m.img)}<h3>${m.name}</h3><p class="rel">${m.rel}</p><p>${m.msg}</p></div>`).join("")}</div>`),
  wrap(`${head("Special moments")}<div class="gal">${CONFIG.memories.map(g=>ph(g)).join("")}</div>`)
]};

/* ---------- router: Back / Next move through screens, then pages ---------- */
const app = $("#app"), nav = $("#nav"), burger = $(".burger");
let page = "home", screens = [], cur = 0, startAt = 0;

function route(){
  page = pages[location.hash.slice(1)] ? location.hash.slice(1) : "home";
  screens = pages[page]();
  cur = startAt === "last" ? screens.length - 1 : 0; startAt = 0;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===page));
  nav.classList.remove("open"); burger.setAttribute("aria-expanded","false");
  document.title = `${CONFIG.name} | ${names[page]}`;
  draw();
}
function draw(){
  app.innerHTML = `<div class="page panel">${screens[cur]}</div>`;
  $("#dots").innerHTML = screens.map((_,i)=>`<i class="${i===cur?"on":""}"></i>`).join("");
  const last = cur === screens.length - 1, nx = names[order[(order.indexOf(page)+1)%4]];
  $("#next").innerHTML = `Next${last ? ": " + nx : ""} →`;
  if(page==="home") startNet();
}
function go(d){
  const i = order.indexOf(page);
  if(d>0){ if(cur<screens.length-1){cur++;draw();} else location.hash = order[(i+1)%4]; }
  else { if(cur>0){cur--;draw();} else { startAt="last"; location.hash = order[(i+3)%4]; } }
}
addEventListener("hashchange",route);
addEventListener("resize",()=>{
  if(page==="achievements" && (innerWidth<700?1:3)!==lastPer){ screens = pages.achievements(); cur = Math.min(cur,screens.length-1); draw(); }
});
$("#next").onclick = () => go(1);
$("#prev").onclick = () => go(-1);
burger.onclick = () => burger.setAttribute("aria-expanded", nav.classList.toggle("open"));
addEventListener("keydown",e=>{ if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1); });
let tx=null;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{ if(tx!==null){const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>70)go(dx<0?1:-1); tx=null;} });

/* ---------- interactions ---------- */
app.addEventListener("click",e=>{
  const ch = e.target.closest(".chip");
  if(ch){
    achFilter = ch.dataset.cat;
    screens = pages.achievements(); cur = 0; draw();
    return;
  }
  const box = e.target.closest(".ph");
  if(box){
    const f = document.createElement("input"); f.type="file"; f.accept="image/*";
    f.onchange = () => { if(f.files[0]){ box.style.backgroundImage = `url('${URL.createObjectURL(f.files[0])}')`; box.classList.add("has"); } };
    f.click();
  }
});
app.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("ph")){e.preventDefault();e.target.click();} });

/* ---------- hero network animation ---------- */
let raf;
function startNet(){
  cancelAnimationFrame(raf);
  const c = $("#net"); if(!c) return;
  const x = c.getContext("2d"), still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  let w,h,pts=[],m={x:-999,y:-999};
  const size = () => { w=c.width=c.offsetWidth; h=c.height=c.offsetHeight; pts=Array.from({length:Math.min(70,Math.floor(w/16))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4})); };
  size(); addEventListener("resize",size);
  c.parentElement.onmousemove = e => { const r=c.getBoundingClientRect(); m.x=e.clientX-r.left; m.y=e.clientY-r.top; };
  c.parentElement.onmouseleave = () => m={x:-999,y:-999};
  (function loop(){
    x.clearRect(0,0,w,h);
    for(const p of pts){
      if(!still){p.x+=p.vx;p.y+=p.vy;}
      if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1;
      x.fillStyle="#27d3ff"; x.beginPath(); x.arc(p.x,p.y,2,0,7); x.fill();
    }
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
      if(d<130){x.strokeStyle=`rgba(45,140,255,${1-d/130})`;x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.stroke();}
    }
    for(const p of pts){const d=Math.hypot(p.x-m.x,p.y-m.y); if(d<170){x.strokeStyle=`rgba(39,211,255,${1-d/170})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(m.x,m.y);x.stroke();}}
    if(!still) raf=requestAnimationFrame(loop);
  })();
}

/* ---------- shared chrome ---------- */
$("#brand").textContent = CONFIG.name;
$("#copy").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}`;
$("#soc").innerHTML = CONFIG.socials.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("");
route();
</script>
